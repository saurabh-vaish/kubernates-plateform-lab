# =============================================================================
# File:
#   environments/kind/kind-cluster-config.yaml
#
# Purpose:
#   Creates the primary Kubernetes cluster used throughout the Platform Lab.
#
# Design Goals:
#   - Reproducible
#   - Multi-node
#   - Production-like topology
#   - Easy to recreate
#
# Production Equivalent:
#   kubeadm cluster configuration
#   OR
#   Managed control plane in AWS EKS
#
# NOTE
#
# This file is intentionally verbose.
#
# Every section is documented because this repository is both
# infrastructure code and learning material.
#
#
# Future additions:
#
# Sprint 2
# - MetalLB
#
# Sprint 3
# - Port Mapping
#
# Sprint 4
# - Extra Mounts
#
# Sprint 5
# - Registry Mirror
#
# Sprint 6
# - Audit Configuration
# =============================================================================

kind: Cluster

# Kind API version.
#
# This defines the schema understood by Kind.
#
apiVersion: kind.x-k8s.io/v1alpha4

# -----------------------------------------------------------------------------
# Cluster Nodes
#
# One control plane
# Three worker nodes
#
# Why?
#
# • Demonstrate scheduling
# • Rolling updates
# • Pod distribution
# • Node failures
# • DaemonSets
# • Affinity
# • Anti-Affinity
#
# -----------------------------------------------------------------------------

nodes:

  # ===========================================================================
  # Control Plane
  # ===========================================================================
  #
  # Runs:
  #
  # - kube-apiserver
  # - etcd
  # - kube-scheduler
  # - kube-controller-manager
  #
  # In production (EKS):
  #
  # AWS manages this node for us.
  #
  # why image and version are being repeated ? 
  # To ensure reproducibility and consistency across all nodes. and in case of any future changes to the image or version, we can easily update it in one place.
  # and also to avoid any potential issues with the image or version.
  #
  - role: control-plane
    image: kindest/node:v1.34.0

  # ===========================================================================
  # Worker Node 1
  # ===========================================================================
  #
  # Runs application workloads.
  #
  - role: worker
    image: kindest/node:v1.34.0

  # ===========================================================================
  # Worker Node 2
  # ===========================================================================
  #
  # Used later for scheduling demonstrations.
  #
  - role: worker
    image: kindest/node:v1.34.0

  # ===========================================================================
  # Worker Node 3
  # ===========================================================================
  #
  # Used for high availability exercises.
  #
  - role: worker
    image: kindest/node:v1.34.0